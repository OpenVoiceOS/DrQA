[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-drqa-plugin"
dynamic = ["version"]
description = "DrQA document reader (Reading Wikipedia to Answer Open-Domain Questions) as an OVOS extractive QA engine"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "jarbasAi", email = "jarbasai@mailfence.com" }
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy",
    "msgpack>=1.0.0",
    "spacy>=3.5.0",
    "tqdm",
    "huggingface_hub",
    "ovos-plugin-manager>=2.1.0,<3.0.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/DrQA"
Source = "https://github.com/OpenVoiceOS/DrQA"

[project.scripts]
drqa-interact = "drqa.interact:main"

[project.entry-points."opm.agents.extractive_qa"]
ovos-drqa-plugin = "drqa.opm:DrQAExtractiveQAEngine"

[tool.setuptools.dynamic]
version = { attr = "drqa.version.__version__" }

[tool.setuptools.packages.find]
include = ["drqa*"]

[tool.pytest.ini_options]
markers = ["network: downloads the model from HuggingFace and runs inference"]
addopts = "-m 'not network'"
testpaths = ["test"]
